# Added by DbProof. Captures the production schema and planner statistics
# every six hours, so drift shows up between deploys: https://app.dbproof.dev/dbproof/prisma-example
name: DbProof capture

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    # The environment holds the two secrets; protect it like production.
    environment: production
    steps:
      - uses: dbproof/capture-action@v1
        with:
          kind: scheduled
          dbproof-url: https://app.dbproof.dev
          capture-token: ${{ secrets.DBPROOF_CAPTURE_TOKEN }}
          capture-dsn: ${{ secrets.DBPROOF_CAPTURE_DSN }}
