# Added by DbProof. Tests this pull request's migrations against a snapshot
# of the production schema: https://app.dbproof.dev/dbproof/prisma-example
name: DbProof check

on:
  pull_request:
    paths:
      - "prisma/migrations/**"

permissions:
  contents: read
  # The check proves which repository it runs in with GitHub's OIDC token,
  # so this workflow needs no DbProof secret.
  id-token: write

jobs:
  migrations:
    name: dbproof/migrations
    runs-on: ubuntu-latest
    # The check starts a throwaway Postgres on production's version, restores
    # production's schema into it, then applies the pull request's migrations
    # one at a time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check compares the pull request with its base branch.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      # Prisma comes from the project's own dependencies.
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - uses: dbproof/check-action@v1
        with:
          project: dbproof/prisma-example
          dbproof-url: https://app.dbproof.dev
          migrations-dir: prisma/migrations
          # The check sets DATABASE_URL to its throwaway database.
          migrate-command: cd "." && npx prisma migrate deploy
